name: klks_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  go_router: ^17.1.0
  intl: ^0.20.2
  photo_view: ^0.15.0
  image_picker: ^1.2.1
  file_picker: ^11.0.1
  url_launcher: ^6.3.2
  signalr_netcore: ^1.4.4
  permission_handler: ^12.0.1
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# ────────────── ASSETS ──────────────
flutter:
  uses-material-design: true
  
  # ── Be Vietnam Pro font ──────────────────────────────────────────────────────
  # Download from: https://fonts.google.com/specimen/Be+Vietnam+Pro
  # Place font files in: assets/fonts/
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
  
  assets:
    - assets/images/
    - assets/icons/

# ────────────── LAUNCHER ICON CONFIG ──────────────
flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/app_icon.png"

  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

  min_sdk_android: 21

  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#0000ff"

  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"